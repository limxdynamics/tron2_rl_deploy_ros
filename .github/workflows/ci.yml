# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-scan:
    name: Lint / license & provenance scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package.xml well-formedness
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          # Every package.xml must be well-formed XML.
          shopt -s globstar nullglob
          files=$(git ls-files '**/package.xml')
          [ -n "$files" ] || { echo "no package.xml found"; exit 1; }
          for f in $files; do
            echo "── xmllint $f"
            xmllint --noout "$f"
          done

      - name: Unresolved <license> lines must carry a ⚠ TO CONFIRM annotation
        run: |
          set -e
          bad=0
          for f in $(git ls-files '**/package.xml'); do
            # For every line containing <license>TODO or <license>Proprietary,
            # the immediately preceding non-blank line MUST contain
            # "⚠ TO CONFIRM". Silently removing the annotation therefore
            # fails CI, and silently changing the value to Apache-2.0
            # would surface in the license-field audit below.
            awk -v file="$f" '
              BEGIN { prev=""; rc=0 }
              /<license>(TODO|Proprietary)</ {
                if (prev !~ /⚠ TO CONFIRM/) {
                  printf("::error file=%s,line=%d::Unresolved <license> without adjacent ⚠ TO CONFIRM annotation: %s\n", file, NR, $0)
                  rc=1
                }
              }
              { if ($0 !~ /^[[:space:]]*$/) prev=$0 }
              END { exit rc }
            ' "$f" || bad=$((bad+1))
          done
          # Also emit an informational audit of every <license> field.
          echo "── license field audit"
          grep -Hn '<license>' $(git ls-files '**/package.xml') || true
          if [ $bad -ne 0 ]; then exit 1; fi

      - name: Deny-list scan for uncontrolled binaries / weights / bags
        run: |
          set -e
          # Any file matching these extensions must be on the allow-list
          # below. New entries require owner sign-off recorded in
          # THIRD_PARTY_NOTICES.md; see CONTRIBUTING.md.
          allow=$(cat <<'EOF'
          onnxruntime_sdk/lib/libonnxruntime.so
          onnxruntime_sdk/lib/libonnxruntime.so.1.10.0
          tron2_controllers/config/SF_TRON2A/policy/policy.onnx
          tron2_controllers/config/SF_TRON2A/policy/encoder.onnx
          tron2_controllers/config/WF_TRON2A/policy/policy.onnx
          tron2_controllers/config/WF_TRON2A/policy/encoder.onnx
          EOF
          )
          hits=$(git ls-files | grep -iE '\.(onnx|pt|pth|ckpt|so(\.[0-9.]+)?|dll|dylib|lib|whl|bag|mcap)$' || true)
          bad=0
          for h in $hits; do
            if ! echo "$allow" | grep -Fxq "$h"; then
              echo "::error file=$h::Controlled artifact not on the CI allow-list. Add to .github/workflows/ci.yml AND THIRD_PARTY_NOTICES.md with owner sign-off, or remove the file."
              bad=$((bad+1))
            fi
          done
          if [ $bad -ne 0 ]; then exit 1; fi

      - name: Private-IP scan (allow-list documented example only)
        run: |
          set -e
          # Any 10.x / 192.168.x / 172.16-31.x address in tracked files
          # must reduce to 10.192.1.2, which now only appears in
          # historical CHANGELOG.md text (SECURITY.md,
          # THIRD_PARTY_NOTICES.md §7). Markdown /
          # YAML command examples should use the <robot-ip> substitution
          # token rather than a literal address.
          allowed_ip='10\.192\.1\.2'
          hits=$(git grep -InE '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)\b' -- ':!*.onnx' ':!*.so' ':!*.so.*' || true)
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qE "$allowed_ip"; then
              continue
            fi
            echo "::error::Private IP outside allow-list: $line"
            bad=$((bad+1))
          done <<< "$hits"
          if [ $bad -ne 0 ]; then exit 1; fi

      - name: Unresolved license markers in top-level docs
        run: |
          set -e
          # Docs describe unresolved items but must always tag them with
          # the ⚠ TO CONFIRM marker. Bare "TODO: license" / "unknown
          # license" wording is a policy defect.
          if grep -rniE 'todo: license|unknown license' \
               README.md THIRD_PARTY_NOTICES.md CHANGELOG.md \
               CONTRIBUTING.md SECURITY.md NOTICE 2>/dev/null; then
            echo "::error::Unresolved license markers in top-level docs (must be ⚠ TO CONFIRM)"
            exit 1
          fi

      - name: EXIF sanity (doc/ media must not carry GPS / author / serial)
        run: |
          sudo apt-get install -y libimage-exiftool-perl
          set -e
          bad=0
          shopt -s nullglob
          for img in doc/*.jpg doc/*.JPG doc/*.jpeg doc/*.png doc/*.gif doc/*.GIF; do
            [ -f "$img" ] || continue
            hits=$(exiftool "$img" | grep -iE '(gps|serial|author|artist|owner)' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$img::EXIF discloses $hits"
              bad=$((bad+1))
            fi
          done
          if [ $bad -ne 0 ]; then exit 1; fi

  catkin-build:
    name: catkin_make (ROS Noetic, full workspace)
    runs-on: ubuntu-latest
    container:
      image: ros:noetic-ros-base-focal
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          set -e
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential libeigen3-dev \
            ros-noetic-ros-control \
            ros-noetic-ros-controllers \
            ros-noetic-controller-manager \
            ros-noetic-hardware-interface \
            ros-noetic-realtime-tools \
            ros-noetic-urdf
      - uses: actions/checkout@v4
        with:
          path: src/tron2_rl_deploy_ros
      - name: Fetch sibling packages (as in README section 3)
        run: |
          set -e
          cd src
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/limxdynamics/tron2-robot-description.git
          git clone --depth 1 https://github.com/limxdynamics/limxsdk-lowlevel.git
          echo "::notice::limxsdk-lowlevel @ $(git -C limxsdk-lowlevel rev-parse --short HEAD)"
      - name: catkin_make
        run: |
          source /opt/ros/noetic/setup.bash
          set +e
          catkin_make > /tmp/catkin.log 2>&1
          rc=$?
          set -e
          tail -n 60 /tmp/catkin.log
          if [ $rc -ne 0 ]; then
            grep -nE "error|Error|Could not find" /tmp/catkin.log | head -n 10 > /tmp/err.txt || true
            while IFS= read -r l; do echo "::error::${l:0:400}"; done < /tmp/err.txt
            exit $rc
          fi
          echo "::notice::catkin_make built $(ls devel/lib | tr '\n' ' ')"
